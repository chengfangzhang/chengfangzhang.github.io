<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="800" fill="#13283f">广义波动方程 → 面波频散正演 → 近地表多尺度反演</text>
  <text x="40" y="84" font-size="15" fill="#5a6f86">研究框架示意图（概念示意，非实际计算结果）</text>

  <!-- Left: layered model -->
  <g transform="translate(40,120)">
    <text x="0" y="0" font-size="17" font-weight="800" fill="#2a63a8">① 近地表介质模型</text>
    <rect x="0" y="20" width="330" height="90" fill="#f5e7d0"/>
    <rect x="0" y="110" width="330" height="110" fill="#e9d6b4"/>
    <rect x="0" y="220" width="330" height="140" fill="#d8c49c"/>
    <rect x="0" y="360" width="330" height="140" fill="#bfae8a"/>
    <g font-size="14" fill="#3b2f1c" font-weight="700">
      <text x="14" y="70">Layer 1 · Vs₁, Vp₁, ρ₁</text>
      <text x="14" y="170">Layer 2 · Vs₂, Vp₂, ρ₂</text>
      <text x="14" y="295">Layer 3 · Vs₃, Vp₃, ρ₃</text>
      <text x="14" y="435">Half-space</text>
    </g>
    <path d="M10 20 Q40 6 70 20 T130 20 T190 20 T250 20 T310 20" fill="none" stroke="#d97921" stroke-width="3"/>
    <text x="200" y="12" font-size="13" fill="#d97921" font-weight="800">Rayleigh / Love</text>
  </g>

  <!-- Arrow -->
  <g fill="#8ea2b6"><path d="M392 360 h40 v-10 l22 20 -22 20 v-10 h-40z"/></g>

  <!-- Middle: dispersion -->
  <g transform="translate(470,120)">
    <text x="0" y="0" font-size="17" font-weight="800" fill="#0f766e">② 频散正演 c(f)</text>
    <rect x="0" y="20" width="320" height="300" fill="#f4f8fb" stroke="#cfdde9"/>
    <line x1="40" y1="290" x2="305" y2="290" stroke="#5a6f86"/>
    <line x1="40" y1="290" x2="40" y2="35" stroke="#5a6f86"/>
    <text x="250" y="312" font-size="13" fill="#5a6f86">频率 f</text>
    <text x="8" y="50" font-size="13" fill="#5a6f86">c</text>
    <path d="M45 70 C 90 120, 120 210, 300 250" fill="none" stroke="#2a63a8" stroke-width="3"/>
    <path d="M95 60 C 130 100, 170 170, 300 205" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M160 55 C 190 85, 220 135, 300 160" fill="none" stroke="#7560ad" stroke-width="3" stroke-dasharray="2 5"/>
    <g font-size="12" font-weight="800"><text x="250" y="270" fill="#2a63a8">M0</text><text x="250" y="222" fill="#0f766e">M1</text><text x="250" y="170" fill="#7560ad">M2</text></g>
    <text x="0" y="350" font-size="14" fill="#13283f" font-weight="700">广义波动方程下的多模式频散计算</text>
    <text x="0" y="374" font-size="14" fill="#5a6f86">介质复杂性 · 数值稳定性 · 计算效率</text>
  </g>

  <g fill="#8ea2b6"><path d="M812 360 h40 v-10 l22 20 -22 20 v-10 h-40z"/></g>

  <!-- Right: multiscale inversion -->
  <g transform="translate(890,120)">
    <text x="0" y="0" font-size="17" font-weight="800" fill="#d97921">③ 多尺度反演 Vs(z)</text>
    <g transform="translate(0,20)">
      <rect x="0" y="0" width="80" height="480" fill="#f4f8fb" stroke="#cfdde9"/>
      <rect x="0" y="0" width="80" height="240" fill="#e2ecf5"/>
      <text x="6" y="500" font-size="12" fill="#5a6f86">粗尺度</text>
      <rect x="100" y="0" width="80" height="480" fill="#f4f8fb" stroke="#cfdde9"/>
      <rect x="100" y="0" width="80" height="110" fill="#d6e6f2"/><rect x="100" y="110" width="80" height="140" fill="#c4dbea"/><rect x="100" y="250" width="80" height="230" fill="#aecbe0"/>
      <text x="106" y="500" font-size="12" fill="#5a6f86">中尺度</text>
      <rect x="200" y="0" width="80" height="480" fill="#f4f8fb" stroke="#cfdde9"/>
      <g fill="#2a63a8">
        <rect x="200" y="0" width="80" height="40" opacity="0.18"/><rect x="200" y="40" width="80" height="50" opacity="0.26"/>
        <rect x="200" y="90" width="80" height="60" opacity="0.32"/><rect x="200" y="150" width="80" height="90" opacity="0.42"/>
        <rect x="200" y="240" width="80" height="110" opacity="0.55"/><rect x="200" y="350" width="80" height="130" opacity="0.7"/>
      </g>
      <text x="206" y="500" font-size="12" fill="#5a6f86">细尺度</text>
    </g>
  </g>
  <text x="40" y="655" font-size="14" fill="#5a6f86">反演由粗到细逐级细化：低频约束整体趋势，高频刻画浅部细节</text>
</svg>
